<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLACK — Private Space</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #030303;
            --panel: rgba(10, 10, 10, .72);
            --border: rgba(255, 255, 255, .09);
            --text: #ededed;
            --muted: #777;
            --dim: #333;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        /* =========================
           AMBIENT BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -5;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,.055),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,.018),
                    transparent 25%
                ),
                #030303;

            animation: ambient 12s ease-in-out infinite alternate;
        }

        @keyframes ambient {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }

        /* =========================
           MOVING GRID
        ========================= */

        .grid {
            position: fixed;
            inset: -100px;
            z-index: -4;

            opacity: .12;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.035) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 10%,
                    transparent 75%
                );

            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(55px, 55px);
            }
        }

        /* =========================
           NOISE
        ========================= */

        .noise {
            position: fixed;
            inset: 0;
            z-index: 20;

            pointer-events: none;

            opacity: .025;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

            animation: noiseMove .25s steps(2) infinite;
        }

        @keyframes noiseMove {
            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(2px,-1px);
            }

            50% {
                transform: translate(-1px,2px);
            }

            75% {
                transform: translate(1px,1px);
            }

            100% {
                transform: translate(0,0);
            }
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid var(--border);

            background: rgba(3,3,3,.55);

            backdrop-filter: blur(18px);

            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 13px;
            letter-spacing: 5px;
        }

        .brand-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #aaa;

            box-shadow:
                0 0 8px #777,
                0 0 20px rgba(255,255,255,.15);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: .45;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .nav-right {
            color: #454545;

            font-size: 9px;
            letter-spacing: 3px;
        }

        /* =========================
           MAIN
        ========================= */

        .screen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 100px 20px 60px;

            perspective: 1000px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            position: relative;

            width: min(780px, 92vw);

            padding: 75px 55px;

            text-align: center;

            background: var(--panel);

            border: 1px solid var(--border);

            backdrop-filter: blur(24px);

            box-shadow:
                0 35px 120px rgba(0,0,0,.75),
                inset 0 1px 0 rgba(255,255,255,.035);

            overflow: hidden;

            animation: cardIn 1.4s cubic-bezier(.2,.8,.2,1) forwards;

            transform-style: preserve-3d;

            transition:
                transform .15s ease-out,
                border-color .4s ease;
        }

        .card:hover {
            border-color: rgba(255,255,255,.14);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(.97);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
                filter: blur(0);
            }
        }

        /* Animated light */

        .card::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            top: -180px;
            left: 50%;

            transform: translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.055),
                    transparent 70%
                );

            pointer-events: none;

            animation: lightMove 7s ease-in-out infinite alternate;
        }

        @keyframes lightMove {
            from {
                transform:
                    translateX(-65%)
                    translateY(0);
            }

            to {
                transform:
                    translateX(-35%)
                    translateY(70px);
            }
        }

        /* Top border animation */

        .card::after {
            content: "";

            position: absolute;

            top: 0;
            left: -30%;

            width: 30%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.5),
                transparent
            );

            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            0% {
                left: -30%;
            }

            100% {
                left: 100%;
            }
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            position: relative;

            display: inline-flex;

            align-items: center;
            gap: 9px;

            padding: 8px 14px;

            border: 1px solid var(--border);

            border-radius: 100px;

            color: #666;

            font-size: 9px;

            letter-spacing: 3px;

            margin-bottom: 30px;

            background: rgba(255,255,255,.015);
        }

        .label span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #777;

            box-shadow: 0 0 7px #777;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            min-height: 32px;

            color: #999;

            font-size: clamp(20px, 3.6vw, 30px);

            line-height: 1.8;

            letter-spacing: 1px;
        }

        .cursor {
            display: inline-block;

            width: 7px;
            height: 17px;

            margin-left: 5px;

            vertical-align: -3px;

            background: #aaa;

            animation: blink .8s infinite;
        }

        @keyframes blink {
            0%,45% {
                opacity: 1;
            }

            46%,100% {
                opacity: 0;
            }
        }

        /* =========================
           INFORMATION
        ========================= */

        .info {
            display: flex;

            justify-content: center;

            gap: 55px;

            margin-top: 48px;

            opacity: 0;

            animation:
                fadeIn 1.5s ease 4s forwards;
        }

        .info-item {
            min-width: 70px;
        }

        .info-title {
            color: #3d3d3d;

            font-size: 8px;

            letter-spacing: 2px;

            margin-bottom: 8px;
        }

        .info-value {
            color: #777;

            font-size: 10px;

            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: fixed;

            bottom: 24px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: center;

            color: #252525;

            font-size: 8px;

            letter-spacing: 4px;

            z-index: 5;
        }

        /* =========================
           CORNERS
        ========================= */

        .corner {
            position: fixed;

            width: 25px;
            height: 25px;

            opacity: .22;

            z-index: 4;
        }

        .corner::before,
        .corner::after {
            content: "";

            position: absolute;

            background: #777;
        }

        .corner::before {
            width: 25px;
            height: 1px;
        }

        .corner::after {
            width: 1px;
            height: 25px;
        }

        .top-left {
            top: 95px;
            left: 30px;
        }

        .top-right {
            top: 95px;
            right: 30px;

            transform: rotate(90deg);
        }

        .bottom-left {
            bottom: 55px;
            left: 30px;

            transform: rotate(-90deg);
        }

        .bottom-right {
            bottom: 55px;
            right: 30px;

            transform: rotate(180deg);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            nav {
                padding: 0 22px;
            }

            .nav-right {
                display: none;
            }

            .card {
                padding: 55px 22px;
            }

            .info {
                gap: 22px;
            }

            .corner {
                display: none;
            }

            footer {
                bottom: 18px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="grid"></div>
    <div class="noise"></div>

    <!-- Navigation -->

    <nav>

        <div class="brand">
            <div class="brand-dot"></div>
            BLACK
        </div>

        <div class="nav-right">
            PRIVATE SPACE
        </div>

    </nav>

    <!-- Decorative corners -->

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Main -->

    <main class="screen">

        <section class="card" id="card">

            <div class="label">
                <span></span>
                SYSTEM ONLINE
            </div>

            <div class="message">

                <span id="typing"></span>

                <span class="cursor"></span>

            </div>

            <div class="info">

                <div class="info-item">
                    <div class="info-title">
                        STATUS
                    </div>

                    <div class="info-value">
                        ACTIVE
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-title">
                        MODE
                    </div>

                    <div class="info-value">
                        PRIVATE
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-title">
                        TIME
                    </div>

                    <div
                        class="info-value"
                        id="clock">
                        --:--:--
                    </div>
                </div>

            </div>

        </section>

    </main>

    <footer>
        NOTHING SPECIAL HERE
    </footer>


    <script>

        /* =========================
           TYPEWRITER
        ========================= */

        const message =
            "Not everything worth finding is meant to be visible.";

        const typing =
            document.getElementById("typing");

        let index = 0;

        function typeWriter() {

            if (index < message.length) {

                typing.textContent =
                    message.substring(0, index + 1);

                index++;

                const speed =
                    45 + Math.random() * 70;

                setTimeout(typeWriter, speed);

            }

        }

        window.addEventListener("load", () => {

            setTimeout(typeWriter, 1200);

        });


        /* =========================
           LIVE CLOCK
        ========================= */

        const clock =
            document.getElementById("clock");

        function updateClock() {

            const now = new Date();

            clock.textContent =
                now.toLocaleTimeString(
                    [],
                    {
                        hour12: false
                    }
                );

        }

        updateClock();

        setInterval(updateClock, 1000);


        /* =========================
           SUBTLE MOUSE PARALLAX
        ========================= */

        const card =
            document.getElementById("card");

        document.addEventListener(
            "mousemove",
            (event) => {

                if (window.innerWidth < 700) {
                    return;
                }

                const x =
                    (event.clientX / window.innerWidth - .5);

                const y =
                    (event.clientY / window.innerHeight - .5);

                const rotateX =
                    y * -2.5;

                const rotateY =
                    x * 2.5;

                card.style.transform =
                    `perspective(1000px)
                     rotateX(${rotateX}deg)
                     rotateY(${rotateY}deg)`;

            }
        );

        document.addEventListener(
            "mouseleave",
            () => {

                card.style.transform =
                    "perspective(1000px) rotateX(0deg) rotateY(0deg)";

            }
        );

    </script>

</body>
</html>
